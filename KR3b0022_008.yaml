body:
  text: 九變篇孫子曰凡用兵之法將受命於君合軍聚眾圯地無舍太下則為敵所囚衢地交合絕地無留圍地則謀死地則戰塗有所不由軍有所不擊城有所不攻地有所不爭君命有所不受無敵於前無君於後閫外之事將軍制之故將通於九變之地利者知用兵矣將不通於九變之利者雖知地形不能得地之利矣治兵不知九變之術雖知五利不能得人之用矣是故智者之慮必雜於利害雜於利而務可信也雜於害而患可解也是故屈諸侯者以害役諸侯者以業趨諸侯者以利趨速也善示以利令忘變而速至我作變以制之亦謂得人之用也故用兵之法無恃其不來恃吾有以待也無恃其不攻恃吾有所不可攻也故將有五危必死可殺也必生可虜也將之怯弱志必生返意不親戰士卒不精上下猶豫可急擊而取之新訓曰為將怯懦見利而不能進太公曰失利後時反受其殃忿速可侮也廉潔可辱也愛民可煩也凡此五者將之過也用兵之災也覆軍殺將必以五危不可不察也
