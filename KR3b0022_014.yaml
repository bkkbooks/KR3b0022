body:
  text: 用間篇孫子曰凡興師十萬出征千里百姓之費公家之奉日費千金內外騷動怠於道路不得操事者七十萬家相守數年以爭一日之勝而愛爵祿百金不知敵之情者不仁之至也非人之將也非主之佐也非勝之主也故明君賢將所以動而勝人成功出於眾者先知也先知者不可取於鬼神不可象於事不可驗於度必取於人知敵之情者也故用間有五有因間有內間有反間有死間有生間五間俱起莫知其道是謂神紀人君之寶也因間者因其鄉人而用之內間者因其官人而用之反間者因其敵間而用之死間者為誑事於外令吾間知之而傳於敵間也生間者反報也故三軍之事莫親於間賞莫厚於間事莫密於間非聖智不能用間非仁義不能使間太公曰仁義者則賢者歸之賢者歸之則其間可用也非微妙不能得間之實微哉微哉無所不用間也間事未發而先聞者間與所告者皆死凡軍之所欲擊城之所欲攻人之所欲殺必先知其守將左右謁者門者舍人之姓名令吾間必索知之必索敵人之間來間我者因而利之導而舍之故反間可得而用也因是而知之故鄉間內間可得而使也因是而知之故死間為誑事可使告敵因是而知之故生間可使如期五間之事主必知之知之必在於反間故反間不可不厚也昔殷之興也伊摯在夏周之興也呂牙在殷故惟明君賢將能以上智為間者必成大功此兵之要三軍之所恃而動也
