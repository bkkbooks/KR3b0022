body:
  text: 火攻篇孫子曰凡火攻有五一曰火人二曰火積三曰火輜四曰火庫五曰火隊行火必有因煙火必素具發火有時起火有日時者天之燥也日者月在箕壁翼軫也凡此四宿者風起之日也凡火攻必因五火之變而應之火發於內則早應之於外火發兵靜者待而勿攻極其火力可從而從之不可從而止火可發於外無待於內以時發之火發上風無攻下風晝風久夜風止凡軍必知有五火之變以數守之故以火佐攻者明以水佐攻者強水可以絶不可以奪夫戰勝攻取而不修其功者凶命曰費留故曰明主慮之良將修之非利不動非得不用非危不戰主不可以怒而興師將不可以慍而致戰合於利而動不合於利而止怒可以復喜慍可以復悅亡國不可以復存死者不可以復生故明君慎之良將警之此安國全軍之道也
