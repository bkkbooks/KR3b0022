body:
  text: 地形篇孫子曰地形有通者有挂者有支者有隘者有險者有遠者我可以往彼可以來曰通通形者先居高陽利糧道以戰則利可以往難以返曰挂挂形者敵無備出而勝之敵若有備出而不勝難以返不利我出而不利彼出而不利曰支支形者敵雖利我我無出也引而去之令敵半出而擊之利隘形者我先居之必盈之以待敵若敵先居之盈而勿從不盈而從之險形者我先居之必居高陽以待敵若敵先居之引而去之勿從也遠形者勢均難以挑戰戰而不利兵勢既均我遠入挑則不利也凡此六者地之道也將之至任不可不察也故兵有走者有弛者有陷者有崩者有亂者有北者凡此六者非天之災將之過也夫勢均以一擊十曰走卒強吏弱曰弛吏強卒弱曰陷大吏怒而不服遇敵懟而自戰將不知其能曰崩將弱不嚴教道不明吏卒無常陳兵縱橫曰亂將不能料敵以少合衆以弱擊強兵無選鋒曰北凡此六者敗之道也將之至任不可不察也夫地形者兵之助也地利待人而險料敵制勝計險厄遠近上將之道也知此而用戰者必勝不知此而用戰者必敗故戰道必勝主曰無戰必戰可也戰道不勝主曰必戰無戰可也寧違於君不逆士衆梅堯臣曰將在軍君命有所不受故進不求名退不避罪唯人是保而利合於主國之寶也視卒如嬰兒故可與之赴深溪視卒如愛子故可與之俱死厚而不能使愛而不能令亂而不能治譬若驕子不可用也唯務行恩恩勢已成刑之必怨唯務行刑刑怨已深恩之不附必使恩威相參賞罰並用然後可以為將可以統衆也知吾卒之可以擊而不知敵之不可擊勝之半也知敵之可擊而不知吾卒之不可以擊勝之半也知敵之可擊知吾卒之可以擊而不知地形之不可以戰勝之半也故知兵者動而不迷舉而不窮故曰知彼知己勝乃不殆知天知地勝乃不窮
