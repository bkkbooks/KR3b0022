body:
  text: 虛實篇孫子曰凡先處戰地而待敵者佚後處戰地而趨戰者勞若敵已處便勢之地己方赴利士馬勞倦則不利矣故善戰者致人而不致於人能使敵人自至者利之也能使敵人不得至者害之也故敵佚能勞之飽能饑之安能動之出其所不趨趨其所不意行千里而不勞者行於無人之地也攻而必取者攻其所不守也守而必固者守其所不攻也故善攻者敵不知其所守善守者敵不知其所攻微乎微乎至於無形神乎神乎至於無聲故能為敵之司命進而不可禦者衝其虛也退而不可追者速而不可及也故我欲戰敵雖高壘深溝不得不與我戰者攻其所必救也我不欲戰畫地而守之以物畫地而守喻其易也蓋我能戾敵人之心不敢至也敵不得與我戰者乖其所之也故形人而我無形則我專而敵分我專為一敵分為十是以十攻其一也則我衆而敵寡能以衆擊寡者則吾之所與戰者約矣吾所與戰之地不可知不可知則敵所備者多敵所備者多則吾所與戰者寡矣故備前則後寡備後則前寡備左則右寡備右則左寡無所不備則無所不寡寡者備人者也衆者使人備己者也備人則我散備我則彼分故知戰之地知戰之日則可千里而會戰以度量知空虛先知戰地之形又審必戰之日則可千里期會先往以待之若敵已先至可不往以勞之不知戰地不知戰日則左不能救右右不能救左前不能救後後不能救前而況遠者數十里近者數里乎以吾度之越人之兵雖多亦奚益於勝敗哉故曰勝可為也若使敵不知戰地期日我之必勝可常有也敵雖衆可使無鬭敵雖多兵我能多設變詐分其形勢使不能併力也故策之而知得失之計策度敵情觀其施為則計數可知作之而知動靜之理形之而知死生之地形相敵情觀其所據則地形勢生死可得而知角之而知有餘不足之處故形兵之極至於無形無形則深間不能窺智者不能謀因形而錯勝於衆衆不能知人皆知我所以勝之形而莫知吾所以制勝之形故其戰勝不復而應形於無窮夫兵形象水兵之形勢如水流遲速之勢無常也水之形避高而趨下兵之形避實而擊虛水因地而制流兵因敵而制勝故兵無常勢水無常形兵有變化地有方圓能因敵變化而取勝者謂之神故五行無常勝四時無常位日有短長月有死生
