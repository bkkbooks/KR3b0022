body:
  text: 形篇孫子曰昔之善戰者先為不可勝以待敵之可勝不可勝在己可勝在敵故善戰者能為不可勝不能使敵之可勝故曰勝可知而不可為不可勝者守也可勝者攻也守則不足攻則有餘善守者藏於九地之下善攻者動於九天之上故能自保而全勝也見勝不過眾人之所知非善之善者也當見未萌言兩軍已交雖料見勝負策不能過絕於人但見近形非遠太公曰智與眾同非國師也戰勝而天下曰善非善之善者也故舉秋毫不為多力見日月不為明目聞雷霆不為聰耳古之所謂善戰者勝於易勝者也故善戰者之勝也無智名無勇功故其戰勝不忒不忒者其所措必勝勝已敗者也故善戰者立於不敗之地而不失敵之敗也是故勝兵先勝而後求戰敗兵先戰而後求勝善用兵者修道而保法故能為勝敗之政兵法一曰度二曰量三曰數四曰稱五曰勝地生度度生量量生數數生稱稱生勝故勝兵若以鎰稱銖敗兵若以銖稱鎰勝者之戰民也若決積水於千仞之谿者形也
