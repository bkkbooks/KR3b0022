body:
  text: 軍爭篇孫子曰凡用兵之法將受命於君合軍聚眾交和而舍莫難於軍爭軍爭之難者以迂為直以患為利故迂其途而誘之以利後人發先人至此知迂直之計者也故軍爭為利軍爭為危舉軍而爭利則不及委軍而爭利則輜重捐是故卷甲而趨日夜不處倍道兼行百里而爭利則擒三將軍勁者先疲者後其法十一而至五十里而爭利則蹶上將軍其法半至三十里而爭利則三分之二至是故軍無輜重則亡無糧食則亡無委積則亡故不知諸侯之謀者不能豫交不知山林險阻沮澤之形者不能行軍不用鄉導者不能得地利故兵以詐立以利動以分合為變者也兵法詭詐以利動敵心或合或離為變化之術故其疾如風其徐如林言緩行須有行列如林以防其掩襲侵掠如火不動如山難知如陰動如雷震掠鄉分眾廓地分利懸權而動先知迂直之計者勝此軍爭之法也軍政曰言不相聞故為金鼓視不相見故為旌旗夫金鼓旌旗者所以一人之耳目也人既專一則勇者不得獨進怯者不得獨退此用眾之法也故夜戰多火鼓晝戰多旌旗所以變人之耳目也故三軍可奪氣將軍可奪心是故朝氣銳司馬法曰新氣勝舊氣新氣即朝氣也晝氣惰暮氣歸朝氣初氣也晝氣再作之氣也暮氣衰竭之氣也故善用兵者避其銳氣擊其惰歸此治氣者也以治待亂以靜待譁此治心者也以近待遠以佚待勞以飽待饑此治力者也無邀正正之旗勿擊堂堂之陳此治變者也故用兵之法高陵勿向背丘勿逆敵背丘陵為陳無有後患則當引軍平地勿迎擊之佯北勿從銳卒勿攻餌兵勿食歸師勿遏人懷歸心必能死戰則不可止而擊也圍師必闕窮寇勿迫此用兵之法也
