body:
  text: 計篇孫子曰兵者國之大事也死生之地存亡之道不可不察也故經之以五事校之以計而索其情一曰道二曰天三曰地四曰將五曰法道者令民與上同意也故可以與之死可以與之生而不畏危一作人不疑謂始終無二志也一作人不危道謂道之以政令齊之以禮教故能化服士民與上下同心也故用兵之妙以權術為道大道廢而有法法廢而有權權廢而有勢勢廢而有術術廢而有數大道淪替人情訛偽非以權數而取之則不得其欲也故其權術之道使民上下同進趨共愛僧一利害故人心歸於德得人之力無私之至也故百萬之眾其心如一可與俱同死力動而不至危亡也臣之於君下之於上若子之事父弟之事兄若手臂之捍頭目而覆胸臆也如此始可與上同意死生同致不畏懼於危疑天者陰陽寒暑時制也兵者法天運也陰陽者剛柔為縮也用陰則沉虛固靜用陽則輕捷猛厲後則用陰先則用陽陰無蔽也陽無察也陰陽之象無定形故兵法天天有寒暑兵有生殺天則應殺而制物兵則應機而制形故曰天地地者高下遠近險易廣狹死生也將者智信仁勇嚴也法者曲制官道主用也凡此五者將莫不聞知之者勝不知者不勝故校之以計而索其情曰主孰有道將孰有能天地孰得法令孰行兵眾孰強士卒孰練賞罰孰明吾以此知勝負矣將聽吾計用之必勝留之將不聽吾計用之必敗去之將裨將也聽吾計畫而勝則留之違吾計畫而敗則除去之計利以聽乃為之勢以佐其外勢者因利而制權也兵者詭道也故能而示之不能用而示之不用近而示之遠遠而示之近利而誘之亂而取之實而備之強而避之怒而撓之敵人盛怒當屈擾之卑而驕之佚而勞之親而離之攻其無備出其不意擊其空虛襲其懈怠使敵不知所以備也故曰兵者無形為妙太公曰動莫神於不意謀莫善於不識此兵家之勝不可先傳也夫未戰而廟筭勝者得筭多也未戰而廟筭不勝者得筭少也多筭勝少筭不勝而況於無筭乎吾以此觀之勝負見矣
