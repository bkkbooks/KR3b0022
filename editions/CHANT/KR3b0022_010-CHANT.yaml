body:
  text: 武經七書本行軍篇孫子曰凡處軍相敵絕山依谷視生處高戰隆無登此處山之軍也絕水必遠水客絕水而來勿迎之於水內令半濟而擊之利欲戰者無附於水而迎客視生處高無迎水流此處水上之軍也絕斥澤唯亟去無留若交軍於斥澤之中必依水草而背眾樹此處斥澤之軍也平陸處易右背高前死後生此處平陸之軍也凡此四軍之利黃帝之所以勝四帝也凡軍好高而惡下貴陽而賤陰養生處實軍無百疾是謂必勝丘陵隄防必處其陽而右背之此兵之利地之助也上雨水沫至欲涉者待其定也凡地有絕澗天井天牢天羅天陷天隙必亟去之勿近也吾遠之敵近之吾迎之敵背之軍旁有險阻潢井蒹葭林木蘙薈者必謹覆索之此伏姦之所也近而靜者恃其險也遠而挑戰者欲人之進也其所居易者利也眾樹動者來也眾草多障者疑也鳥起者伏也獸駭者覆也塵高而銳者車來也卑而廣者徒來也散而條達者樵採也少而往來者營軍也辭卑而益備者進也辭強而進驅者退也輕車先出居其側者陳也無約而請和者謀也奔走而陳兵者期也半進半退者誘也杖而立者飢也汲而先飲者渴也見利而不進者勞也鳥集者虛也夜呼者恐也軍擾者將不重也旌旗動者亂也吏怒者倦也殺馬肉食者軍無糧也懸缶不返其舍者窮寇也諄諄𧬈𧬈徐與人言者失眾也數賞者窘也軍實窘也恐士卒心怠故別行小惠也數罰者困也先暴而後畏其眾者不精之至也來委謝者欲休息也兵怒而相迎久而不合又不相去必謹察之備有別應兵非貴益多唯無武進足以併力料敵取人而已夫唯無慮而易敵者必擒於人卒未親附而罰之則不服不服則難用卒已親附而罰不行則不可用故令之以文齊之以武是謂必取令素行以教其民則民服令不素行以教其民則民不服令素行者與眾相得也
