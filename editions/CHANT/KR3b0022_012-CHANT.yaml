body:
  text: 九地篇孫子曰用兵之法有散地有輕地有爭地有交地有衢地有重地有圯地有圍地有死地諸侯自戰其地為散地入人之地而不深者為輕地我得則利彼得亦利者為爭地我可以往彼可以來者為交地諸侯之地三屬若鄭界於齊楚晉是也先至而得天下之眾者為衢地入人之地深背城邑多者為重地行山林險阻沮澤凡難行之道者為圯地所由入者隘所從歸者迂彼寡可以擊吾之眾者為圍地疾戰則存不疾戰則亡者為死地是故散地則無戰輕地則無止爭地則無攻交地則無絕衢地則合交得交則安失交則危也梅堯臣曰地雖四通何以得天下之助當以重幣合重地則掠因糧於敵也圯地則行圍地則謀死地則戰所謂古之善用兵者能使敵人前後不相及眾寡不相恃貴賤不相救上下不相收卒離而不集兵合而不齊多設疑事出東見西攻南引北使彼狂惑散擾而集聚不得也合於利而動不合於利而止敢問敵眾整而將來待之若何曰先奪其所愛則聽矣兵之情主速乘人之不及由不虞之道攻其所不戒也凡為客之道深入則專主人不克掠於饒野三軍足食謹養而勿勞併氣積力運兵計謀為不可測投之無所往死且不北死焉不得士死無不得也士人盡力兵士甚陷則不懼無所往則固深入則拘不得已則鬭是故其兵不修而戒不求而得不約而親不令而信不求其勝而勝自得也禁祥去疑至死無所之吾士無餘財非惡貨也無餘命非惡壽也令發之日士卒坐者涕霑襟偃臥者涕交賾投之無所往者諸劌之勇也故善用兵者譬如率然率然者常山之蛇也擊其首則尾至擊其尾則首至擊其中則首尾俱至敢問兵可使如率然乎曰可夫吳人與越人相惡也當其同舟而濟遇風其相救也如左右手是故方馬埋輪未足恃也齊勇若一政之道也剛柔皆得地之理也故善用兵者攜手若使一人不得已也將軍之事靜以幽正以治能愚士卒之耳目使之無知易其事革其謀使人無識易其居迂其途使人不得慮帥與之期如登高而去其梯帥與之深入諸侯之地而發其機焚舟破釜若驅群羊驅而往驅而來莫知所之聚三軍之眾投之於險此謂將軍之事也九地之變屈伸之利人情之理不可不察凡為客之道深則專淺則散去國越境而師者絕地也四達者衢地也入深者重地也入淺者輕地也背固前隘者圍地也無所往者死地也是故散地吾將一其志輕地吾將使之屬爭地吾將趨其後交地吾將謹其守衢地吾將固其結重地吾將繼其食圯地吾將進其塗圍地吾將塞其闕意欲突圍示以守固死地吾將示之以不活故兵之情圍則禦不得已則鬭過則從甚陷則無所不從是故不知諸侯之謀者不能預交不知山林險阻沮澤之形者不能行軍不用鄉導者不能得地利四五者不知一非霸王之兵也夫霸王之兵伐大國則其眾不得聚威加於敵則其交不得合以義制人人誰敢拒是故不爭天下之交不養天下之權信己之私威加於敵故其城可拔其國可隳施無法之賞懸無政之令犯三軍之眾若使一人犯之以事勿告以言犯之以利勿告以害投之亡地然後存陷之死地然後生夫眾陷於害然後能為勝敗故為兵之事在於順詳敵之意并敵一向千里殺將此謂巧能成事者也是故政舉之日夷關折符無通其使厲於廊廟之上以誅其事敵人開闔必亟入之開闔間者也有間來則疾內之先其所愛微與之期踐墨隨敵以決戰事是故始如處女敵人開戶後如脫兔敵不及拒
