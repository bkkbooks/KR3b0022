body:
  text: 謀攻篇孫子曰凡用兵之法全國為上破國次之全軍為上破軍次之全旅為上破旅次之全卒為上破卒次之全伍為上破伍次之是故百戰百勝非善之善者也不戰而屈人之兵善之善者也重廟勝也故上兵伐謀九攻九拒是其謀也其次伐交交合強國敵不敢謀其次伐兵其下攻城攻城之法為不得已修櫓轒轀具器械三月而後成距闉又三月而後已將不勝其忿而蟻附之殺士卒三分之一而城不拔者此攻之災也故善用兵者屈人之兵而非戰也拔人之城而非攻也言以威刑服敵不攻而取若鄭伯肉袒以迎楚莊王之類毀人之國而非久也必以全爭於天下故兵不頓而利可全此謀攻之法也故用兵之法十則圍之五則攻之倍則分之敵則能戰之少則能逃之不若則能避之故小敵之堅大敵之擒也小不能當大也言小國不量其力敢與大邦為讎雖權權時堅城固守然後必見擒獲春秋傳曰既不能強又不能弱所以敗也夫將者國之輔也輔周則國必強輔隙則國必弱故君之所以患於軍者三已下語是不知軍之不可以進而謂之進不知軍之不可以退而謂之退是謂縻軍不知三軍之事而同三軍之政者則軍士惑矣不知三軍之權而同三軍之任則軍士疑矣三軍既惑且疑則諸侯之難至矣是謂亂軍引勝三軍之衆疑其所任惑其所為則鄰國諸侯因其乖錯作難而至也太公曰疑志不可以應敵故知勝有五知可以戰與不可以戰者勝能料知敵情審其虛實者勝也識衆寡之用者勝上下同欲者勝以虞待不虞者勝虞度也將能而君不御者勝此五者知勝之道也故曰知彼知己者百戰不殆審知彼已強弱利害之勢雖百戰實無危殆也不知彼而知己一勝一負不知彼不知己每戰必殆
