body:
  text: 勢篇孫子曰凡治衆如治寡分數是也分隊伍也數兵之大數也分數多少制置先定鬭衆如鬭寡形名是也三軍之衆可使必受敵而無敗者奇正是也兵之所加如以碬投卵者虛實是也碬石也兵若訓諫至整部領分明更能審料敵情委知虛實後以兵而加之實同以碬石投卵也凡戰者以正合以奇勝故善出奇者無窮如天地不竭如江河終而復始日月是也死而復生四時是也聲不過五五聲之變不可勝聽也色不過五五色之變不可勝觀也味不過五五味之變不可勝嘗也戰勢不過奇正奇正之變不可勝窮也六韜云奇正發於無窮之源奇正相生如循環之無端孰能窮之激水之疾至於漂石者勢也勢峻則巨石雖重不能止鷙鳥之疾至於毀折者節也是故善戰者其勢險其節短勢如彍弩節如發機紛紛紜紜鬭亂而不可亂也渾渾沌沌形圓而不可敗也亂生於治怯生於勇弱生於彊治亂數也勇怯勢也彊弱形也故善動敵者形之敵必從之豫之敵必取之以利動之以卒待之故善戰者求之於勢不責於人故能擇人而任勢任勢者其戰人也如轉木石木石之性安則靜危則動方則止圓則行故善戰人之勢如轉圓石於千仞之山者勢也
