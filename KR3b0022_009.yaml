body:
  text: 行軍篇孫子曰凡處軍相敵絶山依谷視生處高戰隆無登此處山之軍也絶水必遠水客絶水而來勿迎之於水內令半濟而擊之利欲戰者無附於水而迎客視生處高無迎水流此處水上之軍也絶斥澤惟亟去無留若交軍於斥澤之中必依水草而背衆樹旌旗動者亂也吏怒者倦也粟馬肉食軍無懸缶不返其舍者窮寇也諄諄翕翕徐與人言者失衆也數賞者窘也數罰者困也先暴而後畏其衆者不精之至也來委謝者欲休息也兵怒而相迎久而不合又不相去必謹察之兵非益多也惟無武進奔走而陳兵車者期也半進半退者誘也杖而立者飢也汲而先飲者渴也見利而不進者勞也鳥集者虛也夜呼者恐也軍擾者將不重也鳥起者伏也獸駭者覆也塵高而鋭者車來也卑而廣者徒來也散而條達者樵採也少而往來者營軍也辭卑而益備者進也辭彊而進驅者退也輕車先出居其側者陳也無約而請和者謀也凡地有絶澗天井天牢天羅天陷天隙必亟去之勿近也吾遠之敵近之吾迎之敵背之軍行有險阻潢井葭葦山林蘙薈者必謹覆索之此伏姦之所處也敵近而靜者恃其險也遠而挑戰者欲人之進也其所居易者利也衆樹動者來也衆草多障者疑也此處斥澤之軍也平陸處易而右背高前死後生此處平陸之軍也凡此四軍之利黃帝之所以勝四帝也凡軍好高而惡下貴陽而賤陰養生而處實軍無百疾是謂必勝丘陵隄防必處其陽而右背之此兵之利地之助也上雨水沫至欲涉者待其定也足以併力料敵取人而已夫惟無慮而易敵者必擒於人卒未親附而罰之則不服不服則難用也卒已親附而罰不行則不可用也故令之以文齊之以武是謂必取令素行以教其民則民服令不素行以教其民則民不服令素行者與衆相得也
