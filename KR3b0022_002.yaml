body:
  text: 作戰篇孫子曰凡用兵之法馳車千駟革車千乘帶甲十萬千里饋糧則內外之費賓客之用膠漆之材車甲之奉日費千金然後十萬之師舉矣其用戰也勝久則鈍兵挫鋭攻城則力屈久暴師則國用不足久暴師露衆千里之外則軍國費用不足相供夫鈍兵挫鋭屈力殫貨則諸侯乘其弊而起雖有智者不能善其後矣故兵聞拙速未睹巧之久也雖拙有以速勝夫兵久而國利者未之有也故不盡知用兵之害者則不能盡知用兵之利也善用兵者役不再籍糧不三載取用於國因糧於敵故軍食可足也國之貧於師者遠輸遠輸則百姓貧兵車轉運千里之外財則費於道路人有困窮者近於師者貴賣貴賣則百姓財竭財竭則急於丘役力屈財殫中原內虛於家百姓之費十去其七公家之費破車罷馬甲胄矢弩戟楯蔽櫓丘牛大車十去其六故智將務食於敵食敵一鍾當吾二十鍾𦮼秆一石當吾二十石十斛為鍾計千里轉運道路耗費二十鍾可致一鍾於軍中矣故殺敵者怒也取敵之利者貨也故車戰得車十乘已上賞其先得者而更其旌旗車雜而乘之卒善而養之是謂勝敵而益強故兵貴勝不貴久貴速勝疾還也故知兵之將生民之司命國家安危之主也
